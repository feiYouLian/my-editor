[package]
name = "my-editor"
version = "0.1.0"
description = "轻量级定制文本编辑器"
edition = "2021"
rust-version = "1.77"

[lib]
name = "my_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
encoding_rs = "0.8"
chardetng = "0.1"
ignore = "0.4"
regex = "1"
similar = "2.7.0"
memchr = "2.8.3"
notify = "8"
# 网页抓取：rustls 纯 Rust TLS，跨平台无需系统 OpenSSL；默认特性关闭以控制体积
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# 内置终端：跨平台 PTY（Windows 走 ConPTY）
portable-pty = "0.9"

# 发布体积优化：strip 符号 + LTO + 体积优先优化 + 单代码单元
[profile.release]
strip = true
lto = true
opt-level = "s"
codegen-units = 1
