[package]
name = "my-editor"
version = "0.4.0"
description = "轻量级定制文本编辑器"
edition = "2021"
rust-version = "1.77"

[lib]
name = "my_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# devtools：让发布构建也能打开开发者工具（标题栏「调试」按钮依赖它）
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2"
# 单实例：第二个实例把已有窗口拉到前台后退出，避免并发写 session.json / drafts
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
encoding_rs = "0.8"
chardetng = "0.1"
ignore = "0.4"
regex = "1"
similar = "2.7.0"
memchr = "2.8.3"
notify = "8"
# 网页抓取：rustls 纯 Rust TLS，跨平台无需系统 OpenSSL；默认特性关闭以控制体积
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# 内置终端：跨平台 PTY（Windows 走 ConPTY）
portable-pty = "0.9"
# 删除走系统回收站：误删可从资源管理器还原，比「确认框 + 永久删除」多一道网
trash = "5"

# 发布体积优化：strip 符号 + LTO + 体积优先优化 + 单代码单元
[profile.release]
strip = true
lto = true
opt-level = "s"
codegen-units = 1
