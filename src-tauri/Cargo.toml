[package]
name = "my-editor"
version = "0.5.1"
description = "轻量级定制文本编辑器"
edition = "2021"
rust-version = "1.77"

[lib]
name = "my_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# devtools：让发布构建也能打开开发者工具（标题栏「调试」按钮依赖它）
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2"
# 单实例：第二个实例把已有窗口拉到前台后退出，避免并发写 session.json / drafts
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
encoding_rs = "0.8"
chardetng = "0.1"
ignore = "0.4"
regex = "1"
similar = "2.7.0"
memchr = "2.8.3"
notify = "8"
# 网页抓取：rustls 纯 Rust TLS，跨平台无需系统 OpenSSL；默认特性关闭以控制体积
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# 内置终端：跨平台 PTY（Windows 走 ConPTY）
portable-pty = "0.9"
# 删除走系统回收站：误删可从资源管理器还原，比「确认框 + 永久删除」多一道网
trash = "5"

# Windows 系统剪贴板里的文件列表（CF_HDROP）：让「复制出去 / 粘进来」与资源管理器互通。
# windows crate 本来就在依赖图里（trash 拉进来的），这里只是显式声明 + 打开所需 feature，
# 不引入新的 crate。其它平台走 cfg 分支，返回明确错误。
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_UI_Shell",
] }

# 发布体积优化：strip 符号 + LTO + 体积优先优化 + 单代码单元
[profile.release]
strip = true
lto = true
opt-level = "s"
codegen-units = 1
