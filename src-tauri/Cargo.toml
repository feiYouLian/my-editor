[package]
name = "my-editor"
version = "0.1.0"
description = "轻量级定制文本编辑器"
edition = "2021"
rust-version = "1.77"

[lib]
name = "my_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
encoding_rs = "0.8"
chardetng = "0.1"
ignore = "0.4"
regex = "1"

# 设计文档 8 风险表：strip + LTO + 体积优化，目标安装包 <15MB
[profile.release]
strip = true
lto = true
opt-level = "s"
