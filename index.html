<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>轻量级定制文本编辑器</title>
    <!-- 内联 data: 图标：避免 webview 自动请求 /favicon.ico 得到 404 -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%230d1117'/%3E%3Cpath d='M4 5h8M4 8h8M4 11h5' stroke='%2358a6ff' stroke-width='1.4' stroke-linecap='round'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>
  <body>
    <div id="app">
      <!-- 自定义标题栏：菜单栏左上 / 导航+搜索居中 / 侧栏开关与窗口控制右上 -->
      <!-- deep：整个标题栏可拖动，但按钮等可交互元素自动豁免（Tauri drag.js 规则） -->
      <header class="titlebar" data-tauri-drag-region="deep">
        <span class="logo">my-editor</span>
        <nav class="menubar" id="menubar">
          <button type="button" class="menu-title" data-menu="file">文件</button>
          <button type="button" class="menu-title" data-menu="edit">编辑</button>
          <button type="button" class="menu-title" data-menu="select">选择</button>
          <button type="button" class="menu-title" data-menu="go">转到</button>
        </nav>
        <div class="titlebar-spacer"></div>
        <div class="titlebar-center">
          <button type="button" class="icon-btn" id="nav-prev" title="上一个标签 (Ctrl+PageUp)">&#8592;</button>
          <button type="button" class="icon-btn" id="nav-next" title="下一个标签 (Ctrl+PageDown)">&#8594;</button>
          <button type="button" class="search-box" id="search-box" title="命令面板 (Ctrl+Shift+P)">
            <span class="search-box-icon">&#128269;</span>
            <span class="search-box-text">搜索命令…</span>
          </button>
        </div>
        <div class="titlebar-spacer"></div>
        <button type="button" id="btn-run" class="run-btn" title="运行当前文件（F5）" disabled>▶ 运行</button>
        <button type="button" id="btn-terminal" class="icon-btn terminal-btn" title="终端（Ctrl+`）">&gt;_</button>
        <button type="button" class="icon-btn" id="btn-devtools" title="开发者工具">&#128295;</button>
        <div class="window-controls">
          <button id="win-min" type="button" class="win-btn" title="最小化">&#8211;</button>
          <!-- 不用 title：状态切换会改写文本，原生 tooltip 会在点击后弹出干扰操作，改用 aria-label -->
          <button id="win-max" type="button" class="win-btn" aria-label="最大化 / 还原">&#9634;</button>
          <button id="win-close" type="button" class="win-btn win-btn-close" title="关闭">&#10005;</button>
        </div>
      </header>

      <main class="main">
        <!-- 侧栏通顶：从标题栏下方一直到状态栏，tabs 不再横跨侧栏 -->
        <aside class="sidebar">
          <div class="sidebar-header">
            <span class="sidebar-title" id="ws-name">工作区</span>
            <div class="sidebar-actions">
              <button id="btn-open-dir" type="button" class="icon-btn" title="打开目录" aria-label="打开目录">
                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M1.75 4.25a1 1 0 0 1 1-1h3.1l1.4 1.5h5.95a1 1 0 0 1 1 1v6.5a1 1 0 0 1-1 1H2.75a1 1 0 0 1-1-1z"/><path d="M8 8.4v3.2M6.4 10h3.2"/></svg>
              </button>
              <!-- 侧栏开关放侧栏自己的头部（通用做法：面板的显隐按钮紧贴面板标题） -->
              <button id="btn-sidebar-toggle" type="button" class="icon-btn" title="隐藏侧栏 (Ctrl+B)" aria-label="隐藏侧栏">&#9776;</button>
            </div>
          </div>
          <div id="file-tree" class="file-tree"></div>
        </aside>
        <div id="sidebar-resizer" class="sidebar-resizer" title="拖动调整侧栏宽度（双击复位）"></div>
        <section class="editor-column">
          <div class="tabsbar">
            <!-- 侧栏收起后这里变成最左端，作为唯一的「展开侧栏」入口 -->
            <button type="button" class="icon-btn sidebar-show-btn" id="btn-sidebar-show" title="展开侧栏 (Ctrl+B)" aria-label="展开侧栏" hidden>&#187;</button>
            <div id="tabs" class="tabs-tabs"></div>
            <div id="preview-modes" class="preview-modes hidden">
              <button type="button" data-mode="edit" title="仅编辑">编辑</button>
              <button type="button" data-mode="preview" title="仅预览">预览</button>
              <button type="button" data-mode="split" title="双栏（编辑 + 预览）">双栏</button>
            </div>
          </div>
          <div id="breadcrumb" class="breadcrumb hidden"></div>
          <div id="large-view" class="large-view hidden"></div>
          <div class="editor-area mode-edit">
            <div id="editor"></div>
            <div id="split-resizer" class="split-resizer" title="拖动调整分栏比例（双击复位）"></div>
            <div id="preview-pane"></div>
          </div>
          <div id="search-results" class="hidden"></div>
          <div id="run-output" class="run-panel hidden"></div>
          <div id="terminal-panel" class="terminal-panel hidden"></div>
        </section>
      </main>

      <footer class="statusbar">
        <span id="status-path" class="status-path" data-field="path">未打开文件</span>
        <span class="status-sep"></span>
        <span id="status-readonly" class="status-readonly hidden" data-field="readonly">只读</span>
        <span class="status-sep"></span>
        <span id="status-size" data-field="size">—</span>
        <span class="status-sep"></span>
        <span id="status-encoding" data-field="encoding">UTF-8</span>
        <span class="status-sep"></span>
        <span id="status-newline" data-field="newline">—</span>
        <span class="status-sep"></span>
        <span id="status-language" data-field="language">纯文本</span>
        <span class="status-sep"></span>
        <span id="status-whitespace" class="status-toggle" data-field="whitespace" title="点击切换空白字符显示">空白: 隐</span>
        <span class="status-sep"></span>
        <span id="status-wrap" class="status-toggle" data-field="wrap" title="点击切换自动换行">换行: 关</span>
        <span class="status-sep"></span>
        <span class="status-spacer"></span>
        <span id="status-cursor" data-field="cursor">行 1，列 1</span>
        <span class="status-sep"></span>
        <span id="status-lines" data-field="lines">共 0 行</span>
        <span class="status-sep"></span>
        <span id="status-dirty" class="dirty hidden" data-field="dirty">● 未保存</span>
        <span id="status-external" class="status-external hidden" title="磁盘文件已被外部修改，点击重新载入">外部修改</span>
        <span id="status-draft" class="status-draft hidden">草稿已存</span>
        <span class="status-sep"></span>
        <span id="status-message" class="status-message hidden"></span>
      </footer>
    </div>

    <!-- 无边框窗口的缩放热区（调用 Tauri startResizeDragging） -->
    <div class="resize-zone rz-n" data-resize="North"></div>
    <div class="resize-zone rz-s" data-resize="South"></div>
    <div class="resize-zone rz-e" data-resize="East"></div>
    <div class="resize-zone rz-w" data-resize="West"></div>
    <div class="resize-zone rz-ne" data-resize="NorthEast"></div>
    <div class="resize-zone rz-nw" data-resize="NorthWest"></div>
    <div class="resize-zone rz-se" data-resize="SouthEast"></div>
    <div class="resize-zone rz-sw" data-resize="SouthWest"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
