name: release

on:
  push:
    tags:
      - "v*"
  # 手动重建：用当前 HEAD 的版本号发版（tag 不存在时由 action 创建）
  workflow_dispatch:

# 创建/更新 Release 需要写权限：新建 GitHub 仓库的 GITHUB_TOKEN 默认只读
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
            rust-targets: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
            rust-targets: "aarch64-apple-darwin,x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
            rust-targets: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Linux 系统依赖
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: npm ci

      # 版本号由 tauri.conf.json 决定（action 里的 __VERSION__ 取自它），
      # tag 与之不一致会产出「标题版本 ≠ 安装包版本」的 Release
      - name: 校验 tag 与版本号一致
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$tag" != "$ver" ]; then
            echo "::error::tag v$tag 与 tauri.conf.json 的 version $ver 不一致，先改版本号再重打 tag"
            exit 1
          fi

      - name: 构建安装包并发布 Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # 三个平台并行上传到同一个 tag 的 Release，action 会自动命中已存在的 Release
          tagName: v__VERSION__
          releaseName: "my-editor v__VERSION__"
          releaseBody: |
            ## 安装

            - Windows：`*_x64-setup.exe`（NSIS，当前用户安装）或 `*.msi`
            - macOS：`*.dmg`（universal，未签名；首次打开需在「系统设置 ▸ 隐私与安全性」允许）
            - Linux：`*.AppImage` / `*.deb` / `*.rpm`

            安装包未做代码签名，Windows SmartScreen 可能提示「未知发布者」。
          # 默认发为草稿：Actions 跑完后到 Releases 页面确认产物齐全再点 Publish
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: 上传安装包为构建产物
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/**
            src-tauri/target/**/release/bundle/**
          if-no-files-found: warn
