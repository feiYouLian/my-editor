name: release

on:
  push:
    tags:
      - "v*"
  # 手动重建：用当前 HEAD 的版本号发版（tag 不存在时由 action 创建）
  workflow_dispatch:

# 创建/更新 Release 需要写权限：新建 GitHub 仓库的 GITHUB_TOKEN 默认只读
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
            rust-targets: ""
          # 暂只发 Windows。恢复多平台时取消以下注释，
          # 并同步恢复「安装 Linux 系统依赖」步骤与 releaseBody 中的产物说明。
          # - platform: macos-latest
          #   args: "--target universal-apple-darwin"
          #   rust-targets: "aarch64-apple-darwin,x86_64-apple-darwin"
          # - platform: ubuntu-22.04
          #   args: ""
          #   rust-targets: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      # 仅 Linux 需要；Windows-only 阶段先注释，恢复 ubuntu 矩阵项时一并取消注释
      # - name: 安装 Linux 系统依赖
      #   if: matrix.platform == 'ubuntu-22.04'
      #   run: |
      #     sudo apt-get update
      #     sudo apt-get install -y \
      #       libwebkit2gtk-4.1-dev \
      #       libappindicator3-dev \
      #       librsvg2-dev \
      #       patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 版本号由 tauri.conf.json 决定（action 里的 __VERSION__ 取自它），
      # tag 与之不一致会产出「标题版本 ≠ 安装包版本」的 Release。
      # 纯本地校验、秒级，放在发布检查之前，避免版本号错了却先看到网络侧的报错。
      - name: 校验 tag 与版本号一致
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$tag" != "$ver" ]; then
            echo "::error::tag v$tag 与 tauri.conf.json 的 version $ver 不一致，先改版本号再重打 tag"
            exit 1
          fi

      # GitHub 的「发布不可变」特性：Release 一旦发布，其资产不能删除也不能替换。
      # tauri-action 覆盖上传的做法是「先删同名 asset 再上传」，撞上不可变 Release 会直接报
      # Cannot delete asset from an immutable release —— 而且是在编译打包几分钟之后才报。
      # 这里在编译前先判定，失败只花十几秒。分三种情况：
      #   草稿      → 允许覆盖（tauri-action 正常更新）
      #   已发布+不可变 → 必然失败，提前退出并提示升版本号
      #   已发布但可变   → 能跑通，仅告警（覆盖会让旧安装包消失）
      - name: 检查目标 tag 的 Release 状态
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # tag 事件用实际 tag；workflow_dispatch 没有 tag，由 tauri-action 按版本号创建
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="v$(node -p 'require("./src-tauri/tauri.conf.json").version')"
          fi

          if ! info=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" \
              --jq '[.draft, (.immutable // false)] | @tsv' 2>/dev/null); then
            echo "tag ${tag} 尚无 Release（或读取失败），将由 tauri-action 新建"
            exit 0
          fi

          read -r draft immutable <<< "$info"
          if [ "$draft" = "true" ]; then
            echo "tag ${tag} 的 Release 仍是草稿，允许覆盖上传"
          elif [ "$immutable" = "true" ]; then
            echo "::error::tag ${tag} 已发布且为不可变 Release（${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${tag}），其安装包不能删除或替换。若该 Release 产物已完整则无需重跑；若需要重新构建，请把 package.json / src-tauri/Cargo.toml / src-tauri/tauri.conf.json 的版本号一同升上去后打新 tag。"
            exit 1
          else
            echo "::warning::tag ${tag} 已有已发布的 Release，本次将覆盖其现有安装包。更稳妥的做法是先删除该 Release 或升级版本号。"
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: npm ci

      - name: 构建安装包并发布 Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # 三个平台并行上传到同一个 tag 的 Release，action 会自动命中已存在的 Release
          tagName: v__VERSION__
          releaseName: "my-editor v__VERSION__"
          releaseBody: |
            ## 安装

            - Windows：`*_x64-setup.exe`（NSIS，当前用户安装）或 `*.msi`

            当前仅发布 Windows 安装包。安装包未做代码签名，SmartScreen 可能提示「未知发布者」。
          # 默认发为草稿：Actions 跑完后到 Releases 页面确认产物齐全再点 Publish
          # 注意：仓库开启「发布不可变」时，点 Publish 后该 Release 永久不可覆盖，
          # 后续要更新安装包只能升版本号发新 tag（前置检查会在编译前拦住这种覆盖）
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: 上传安装包为构建产物
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/**
            src-tauri/target/**/release/bundle/**
          if-no-files-found: warn
