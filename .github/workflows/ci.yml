name: ci

# 日常门禁：任何提交/PR 都跑与本地「验收基线」相同的四项检查。
# 发布（打 tag、安装包、Release）见 release.yml；签名与更新资产的密钥由仓库 Secrets 提供。
on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    # 与发布目标平台一致：只在 Windows 上验证，避免"本地通过、打包失败"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: npm ci

      # 类型检查 + 生产构建（等价于本地 `npm run verify`）
      - name: 类型检查与构建
        run: npm run verify

      - name: 前端单测
        run: npm test

      # 静态契约与护栏（只读扫描 / 集合比较，失败即非零退出）
      - name: IPC 参数契约
        run: node scripts/check-ipc-contract.mjs

      - name: 生产代码 panic 点
        run: node scripts/scan-unsafe.mjs

      - name: DOM 注入面
        run: node scripts/scan-innerhtml.mjs

      - name: E2E 类型检查
        run: npm run typecheck:e2e

      # E2E 连真实应用：先构建调试版（免安装包），Playwright 经 WebView2 CDP 接入。
      # build:e2e 会把 CDP 端口烧进窗口参数——环境变量是否被 WebView2 合并随运行时版本而异，
      # 只靠 WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS 在 runner 上会「端口永远起不来」。
      - name: 构建调试版应用（E2E）
        if: ${{ hashFiles('playwright.config.ts') != '' }}
        run: npm run build:e2e

      - name: E2E 关键路径
        if: ${{ hashFiles('playwright.config.ts') != '' }}
        run: npm run test:e2e

      - name: Rust 单测
        run: cargo test --lib
        working-directory: src-tauri
